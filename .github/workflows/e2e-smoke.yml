name: E2E Smoke (optional)

# Runs only when the stack is known to be up (manual or scheduled self-hosted).
# Default CI does not start Docker Compose (too heavy / flaky on free runners).
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  playwright:
    name: Playwright smoke
    runs-on: ubuntu-latest
    # Skip until you provide a public preview URL as a repo variable.
    if: ${{ vars.E2E_BASE_URL != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci --prefix frontend --legacy-peer-deps
      - name: Install Playwright browser
        run: npx --prefix frontend playwright install --with-deps chromium
      - name: Run smoke
        working-directory: frontend
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
        run: npx playwright test
