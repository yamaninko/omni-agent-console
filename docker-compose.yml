name: omni-agent-console

services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${FRONTEND_HOST_PORT:-4210}:80"
    depends_on:
      - backend-api

  backend-api:
    build:
      context: .
      dockerfile: backend/src/OmniAgentConsole.Api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      Database__ApplyMigrationsOnStartup: "true"
      ConnectionStrings__Postgres: ${POSTGRES_CONNECTION_STRING:-Host=postgres;Port=5432;Database=omniagent_console;Username=postgres;Password=postgres}
      ConnectionStrings__Redis: ${REDIS_CONNECTION_STRING:-redis:6379}
      ConnectionStrings__RabbitMq: ${RABBITMQ_CONNECTION_STRING:-amqp://guest:guest@rabbitmq:5672}
      TaskQueue__Mode: ${TASK_QUEUE_MODE:-RabbitMq}
      TaskQueue__QueueName: ${TASK_QUEUE_NAME:-omniagent-console.task-runs}
      TaskQueue__PollIntervalMilliseconds: ${TASK_QUEUE_POLL_INTERVAL_MS:-500}
      Providers__OmniAgent__BaseUrl: ${OMNIAGENT_BASE_URL:-https://integrate.api.nvidia.com/v1}
      Providers__OmniAgent__DefaultModel: ${OMNIAGENT_DEFAULT_MODEL:-meta/llama-3.1-8b-instruct}
      Providers__OmniAgent__ApiKeySecretName: ${OMNIAGENT_API_KEY_SECRET_NAME:-secret/providers/omniagent#apiKey}
      OMNIAGENT_API_KEY: ${OMNIAGENT_API_KEY:-}
      Console__ApiKey: ${CONSOLE_API_KEY:-}
      Vault__Enabled: "true"
      Vault__Address: http://vault:8200
      Vault__Token: ${VAULT_DEV_ROOT_TOKEN_ID:-dev-root-token}
      Vault__Mount: secret
      Vault__OmniAgentApiKeyPath: providers/omniagent
      Cors__AllowedOrigins__0: http://localhost:4210
    ports:
      - "${BACKEND_HOST_PORT:-5080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      vault:
        condition: service_healthy
    volumes:
      - ./workspace:/workspace

  agent-worker:
    build:
      context: .
      dockerfile: backend/src/OmniAgentConsole.Worker/Dockerfile
    environment:
      ConnectionStrings__Postgres: ${POSTGRES_CONNECTION_STRING:-Host=postgres;Port=5432;Database=omniagent_console;Username=postgres;Password=postgres}
      ConnectionStrings__Redis: ${REDIS_CONNECTION_STRING:-redis:6379}
      ConnectionStrings__RabbitMq: ${RABBITMQ_CONNECTION_STRING:-amqp://guest:guest@rabbitmq:5672}
      TaskQueue__Mode: ${TASK_QUEUE_MODE:-RabbitMq}
      TaskQueue__QueueName: ${TASK_QUEUE_NAME:-omniagent-console.task-runs}
      TaskQueue__PollIntervalMilliseconds: ${TASK_QUEUE_POLL_INTERVAL_MS:-500}
      Providers__OmniAgent__ApiKeySecretName: ${OMNIAGENT_API_KEY_SECRET_NAME:-secret/providers/omniagent#apiKey}
      OMNIAGENT_API_KEY: ${OMNIAGENT_API_KEY:-}
      Vault__Enabled: "true"
      Vault__Address: http://vault:8200
      Vault__Token: ${VAULT_DEV_ROOT_TOKEN_ID:-dev-root-token}
      Vault__Mount: secret
      Vault__OmniAgentApiKeyPath: providers/omniagent
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      vault:
        condition: service_healthy
    volumes:
      - ./workspace:/workspace

  vault:
    image: hashicorp/vault:1.19
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:-dev-root-token}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    command: server -dev
    # Infra ports bind to loopback by default: these services carry secrets
    # (plain-text credentials, dev root token) and must not be reachable from
    # the local network. Override INFRA_BIND_ADDRESS only if you know why.
    ports:
      - "${INFRA_BIND_ADDRESS:-127.0.0.1}:${VAULT_HOST_PORT:-8201}:8200"
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-omniagent_console}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${INFRA_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-omniagent_console}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${INFRA_BIND_ADDRESS:-127.0.0.1}:${REDIS_HOST_PORT:-56379}:6379"

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "${INFRA_BIND_ADDRESS:-127.0.0.1}:${RABBITMQ_HOST_PORT:-5673}:5672"
      - "${INFRA_BIND_ADDRESS:-127.0.0.1}:${RABBITMQ_MANAGEMENT_HOST_PORT:-15673}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  opensearch:
    image: opensearchproject/opensearch:2
    profiles:
      - observability
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: "ChangeMe123!"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${INFRA_BIND_ADDRESS:-127.0.0.1}:9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2
    profiles:
      - observability
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "${INFRA_BIND_ADDRESS:-127.0.0.1}:5601:5601"
    depends_on:
      - opensearch

volumes:
  postgres-data:
  opensearch-data:
