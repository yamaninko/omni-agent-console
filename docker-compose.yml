name: omni-agent-console

# Resource limits keep Docker Desktop (especially Windows/WSL2) from pinning
# the host when the stack is idle. Raise limits in .env if a task OOM-kills.
services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${FRONTEND_HOST_PORT:-4210}:80"
    depends_on:
      - backend-api
    deploy:
      resources:
        limits:
          cpus: "${FRONTEND_CPU_LIMIT:-0.5}"
          memory: ${FRONTEND_MEM_LIMIT:-128M}

  backend-api:
    build:
      context: .
      dockerfile: backend/src/OmniAgentConsole.Api/Dockerfile
    deploy:
      resources:
        limits:
          cpus: "${API_CPU_LIMIT:-1.5}"
          memory: ${API_MEM_LIMIT:-768M}
    environment:
      ASPNETCORE_URLS: http://+:8080
      Database__ApplyMigrationsOnStartup: "true"
      ConnectionStrings__Postgres: ${POSTGRES_CONNECTION_STRING:-Host=postgres;Port=5432;Database=omniagent_console;Username=postgres;Password=postgres}
      ConnectionStrings__Redis: ${REDIS_CONNECTION_STRING:-redis:6379}
      ConnectionStrings__RabbitMq: ${RABBITMQ_CONNECTION_STRING:-amqp://guest:guest@rabbitmq:5672}
      TaskQueue__Mode: ${TASK_QUEUE_MODE:-RabbitMq}
      TaskQueue__QueueName: ${TASK_QUEUE_NAME:-omniagent-console.task-runs}
      TaskQueue__PollIntervalMilliseconds: ${TASK_QUEUE_POLL_INTERVAL_MS:-1500}
      Providers__OmniAgent__BaseUrl: ${OMNIAGENT_BASE_URL:-https://integrate.api.nvidia.com/v1}
      Providers__OmniAgent__DefaultModel: ${OMNIAGENT_DEFAULT_MODEL:-meta/llama-3.1-8b-instruct}
      Providers__OmniAgent__ApiKeySecretName: ${OMNIAGENT_API_KEY_SECRET_NAME:-secret/providers/omniagent#apiKey}
      OMNIAGENT_API_KEY: ${OMNIAGENT_API_KEY:-}
      Console__ApiKey: ${CONSOLE_API_KEY:-}
      SharedLab__Enabled: ${SHARED_LAB:-false}
      Vault__Enabled: "true"
      Vault__Address: http://vault:8200
      Vault__Token: ${VAULT_DEV_ROOT_TOKEN_ID:-dev-root-token}
      Vault__Mount: secret
      Vault__OmniAgentApiKeyPath: providers/omniagent
      # Mirror secrets to a host-mounted volume so Vault -dev restarts do not wipe keys.
      FileSecretStore__RootPath: /var/omni/secrets
      FileSecretStore__MirrorEnabled: ${FILE_SECRET_MIRROR:-true}
      Cors__AllowedOrigins__0: http://localhost:4210
      WorkspaceRunner__Enabled: ${WORKSPACE_RUNNER_ENABLED:-true}
      WorkspaceRunner__PortRangeStart: ${WORKSPACE_RUNNER_PORT_START:-18000}
      WorkspaceRunner__PortRangeSize: ${WORKSPACE_RUNNER_PORT_SIZE:-1000}
      WorkspaceRunner__MaxConcurrent: ${WORKSPACE_RUNNER_MAX_CONCURRENT:-3}
      WorkspaceRunner__BuildTimeoutSeconds: ${WORKSPACE_RUNNER_BUILD_TIMEOUT:-300}
      WorkspaceRunner__HealthProbeHost: ${WORKSPACE_RUNNER_HEALTH_HOST:-host.docker.internal}
    ports:
      - "${BACKEND_HOST_PORT:-5080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      vault:
        condition: service_healthy
    volumes:
      - ./workspace:/workspace
      - ./data/secrets:/var/omni/secrets
      # Allow the API to start student/demo stacks generated under /workspace.
      - /var/run/docker.sock:/var/run/docker.sock

  agent-worker:
    build:
      context: .
      dockerfile: backend/src/OmniAgentConsole.Worker/Dockerfile
    deploy:
      resources:
        limits:
          cpus: "${WORKER_CPU_LIMIT:-2.0}"
          memory: ${WORKER_MEM_LIMIT:-1G}
    environment:
      ConnectionStrings__Postgres: ${POSTGRES_CONNECTION_STRING:-Host=postgres;Port=5432;Database=omniagent_console;Username=postgres;Password=postgres}
      ConnectionStrings__Redis: ${REDIS_CONNECTION_STRING:-redis:6379}
      ConnectionStrings__RabbitMq: ${RABBITMQ_CONNECTION_STRING:-amqp://guest:guest@rabbitmq:5672}
      TaskQueue__Mode: ${TASK_QUEUE_MODE:-RabbitMq}
      TaskQueue__QueueName: ${TASK_QUEUE_NAME:-omniagent-console.task-runs}
      TaskQueue__PollIntervalMilliseconds: ${TASK_QUEUE_POLL_INTERVAL_MS:-1500}
      TaskWatchdog__Enabled: ${TASK_WATCHDOG_ENABLED:-true}
      TaskWatchdog__StallWarningMinutes: ${TASK_WATCHDOG_WARN_MINUTES:-10}
      TaskWatchdog__StallFailureMinutes: ${TASK_WATCHDOG_FAIL_MINUTES:-20}
      Providers__OmniAgent__ApiKeySecretName: ${OMNIAGENT_API_KEY_SECRET_NAME:-secret/providers/omniagent#apiKey}
      OMNIAGENT_API_KEY: ${OMNIAGENT_API_KEY:-}
      Vault__Enabled: "true"
      Vault__Address: http://vault:8200
      Vault__Token: ${VAULT_DEV_ROOT_TOKEN_ID:-dev-root-token}
      Vault__Mount: secret
      Vault__OmniAgentApiKeyPath: providers/omniagent
      FileSecretStore__RootPath: /var/omni/secrets
      FileSecretStore__MirrorEnabled: ${FILE_SECRET_MIRROR:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      vault:
        condition: service_healthy
    volumes:
      - ./workspace:/workspace
      - ./data/secrets:/var/omni/secrets

  vault:
    image: hashicorp/vault:1.19
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:-dev-root-token}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    command: server -dev
    # Infra ports bind to loopback by default: these services carry secrets
    # (plain-text credentials, dev root token) and must not be reachable from
    # the local network. Override INFRA_BIND_ADDRESS only if you know why.
    ports:
      - "${INFRA_BIND_ADDRESS:-127.0.0.1}:${VAULT_HOST_PORT:-8201}:8200"
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          # Vault 1.19 + Go runtime OOM-kills under 256M (exit 137) on cold start.
          cpus: "0.5"
          memory: ${VAULT_MEM_LIMIT:-512M}

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-omniagent_console}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${INFRA_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-omniagent_console}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  redis:
    image: redis:7-alpine
    ports:
      - "${INFRA_BIND_ADDRESS:-127.0.0.1}:${REDIS_HOST_PORT:-56379}:6379"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "${INFRA_BIND_ADDRESS:-127.0.0.1}:${RABBITMQ_HOST_PORT:-5673}:5672"
      - "${INFRA_BIND_ADDRESS:-127.0.0.1}:${RABBITMQ_MANAGEMENT_HOST_PORT:-15673}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M

  opensearch:
    image: opensearchproject/opensearch:2
    profiles:
      - observability
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: "ChangeMe123!"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${INFRA_BIND_ADDRESS:-127.0.0.1}:9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2
    profiles:
      - observability
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "${INFRA_BIND_ADDRESS:-127.0.0.1}:5601:5601"
    depends_on:
      - opensearch

volumes:
  postgres-data:
  opensearch-data:
